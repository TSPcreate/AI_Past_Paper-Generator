[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "past-paper-generator"
version = "0.1.0"
description = "GCSE past paper generator demo"
readme = "README.md"
authors = [{ name = "AI Assistant" }]
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3",
    "reportlab>=3.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
